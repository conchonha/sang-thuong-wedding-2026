    <rect x="145" y="180" width="16" height="16" rx="2"/>
    <rect x="120" y="215" width="14" height="24" rx="2"/>

    <rect x="250" y="180" width="24" height="12" rx="2"/>
    <rect x="290" y="190" width="16" height="25" rx="2"/>
