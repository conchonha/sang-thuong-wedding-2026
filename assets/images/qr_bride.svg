<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5989B"/>
      <stop offset="50%" stop-color="#FFB4A2"/>
      <stop offset="100%" stop-color="#B5838D"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8F8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="380" height="460" rx="20" fill="url(#cardBg)" stroke="url(#roseGoldGrad)" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Header Bar -->
  <path d="M 12 30 Q 12 12 30 12 L 370 12 Q 388 12 388 30 L 388 70 L 12 70 Z" fill="#b91d47"/>
  <text x="200" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">TECHCOMBANK • VIETQR</text>
  <text x="200" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#FFCCD5" text-anchor="middle">MỪNG CƯỚI CÔ DÂU</text>

  <!-- QR Pattern Box -->
  <rect x="50" y="90" width="300" height="300" rx="14" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="1.5"/>
  
  <!-- Corner 1 (Top Left) -->
  <rect x="75" y="115" width="55" height="55" rx="8" fill="none" stroke="#1A202C" stroke-width="8"/>
  <rect x="91" y="131" width="23" height="23" rx="4" fill="#E5989B"/>
  
  <!-- Corner 2 (Top Right) -->
  <rect x="270" y="115" width="55" height="55" rx="8" fill="none" stroke="#1A202C" stroke-width="8"/>
  <rect x="286" y="131" width="23" height="23" rx="4" fill="#E5989B"/>
  
  <!-- Corner 3 (Bottom Left) -->
  <rect x="75" y="310" width="55" height="55" rx="8" fill="none" stroke="#1A202C" stroke-width="8"/>
  <rect x="91" y="326" width="23" height="23" rx="4" fill="#E5989B"/>

  <!-- Center Logo Badge -->
  <circle cx="200" cy="240" r="32" fill="#FFFFFF" stroke="url(#roseGoldGrad)" stroke-width="2.5"/>
  <text x="200" y="246" font-family="'Alex Brush', cursive" font-size="24" font-weight="bold" fill="#B5838D" text-anchor="middle">HY</text>

  <!-- Data Matrix Dots Grid -->
  <g fill="#2D3748">
    <rect x="150" y="120" width="12" height="12" rx="2"/>
    <rect x="175" y="120" width="22" height="12" rx="2"/>
    <rect x="210" y="120" width="12" height="22" rx="2"/>
    <rect x="235" y="120" width="18" height="12" rx="2"/>

