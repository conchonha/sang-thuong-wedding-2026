  <text x="200" y="438" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#B5838D" text-anchor="middle" letter-spacing="1">1903 6688 9999</text>
  <text x="200" y="456" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#718096" text-anchor="middle">Techcombank - Chi nhánh Thăng Long</text>
